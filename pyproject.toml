[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chippilot"
version = "0.1.0"
description = "AI-powered CLI agent for chip design EDA/CAD workflows"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
dev = ["pytest>=8.0"]

[project.scripts]
chippilot = "chippilot.main:main"
chippilot-mcp = "chippilot.mcp_server:main"

[tool.setuptools.packages.find]
include = ["chippilot*"]
